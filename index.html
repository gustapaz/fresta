<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f2f2ea" />
    <meta
      name="description"
      content="Leia o gelo antes de avançar. Explore três mapas, interprete os números e marque as fendas ocultas em Fresta, um jogo gratuito de dedução."
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Fresta — leia o gelo antes de avançar</title>
    <link rel="icon" href="./favicon.svg" />
  </head>
  <body>
    <div id="app">
      <p>Preparando o mapa… Se não carregar, recarregue a página.</p>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <span class="eyebrow">FRESTA / PAUSA NA EXPEDIÇÃO</span>
      <h2 id="dialog-title">O gelo pode esperar.</h2>
      <div id="dialog-body"></div>
      <button id="resume" class="orange">Voltar ao mapa ↗</button>
    </dialog>
    <noscript
      >Ative JavaScript para explorar o mapa fictício de Fresta. Sem conta ou
      compras.</noscript
    >
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
